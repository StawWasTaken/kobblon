<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="preload" as="image" href="/brand/logo-reveal.gif" />
    <meta name="theme-color" content="#101012" />
    <meta name="description" content="Build your own Space, fill it with whatever you want, and let people in." />
    <title>Kobblon</title>
    <link rel="canonical" href="https://kobblon.com/" />

    <!--
      What a link to Kobblon looks like when it is pasted somewhere else.
      These are the defaults for the whole site; a page that knows better
      replaces them, and the build writes its own set into each page it can
      work out ahead of time.
    -->
    <meta property="og:site_name" content="Kobblon" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kobblon.com/" />
    <meta property="og:title" content="Kobblon" />
    <meta property="og:description" content="Make something nobody else has. Build your own Space, fill it with whatever you want, and let people in." />
    <meta property="og:image" content="https://kobblon.com/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kobblon" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kobblon" />
    <meta name="twitter:description" content="Make something nobody else has. Build your own Space, fill it with whatever you want, and let people in." />
    <meta name="twitter:image" content="https://kobblon.com/brand/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://use.typekit.net/lqk3dkx.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /*
       * What the page looks like before any of it has arrived.
       *
       * A refresh showed a blank dark rectangle for as long as the bundle
       * took, because everything that draws anything - the boot screen
       * included - lives inside it. This is in the document itself, so it is
       * on screen at the first paint, and React replaces it the moment it
       * mounts.
       *
       * Staw's reveal and nothing else. It was behind a still logomark that
       * faded out under it, and that was wrong twice over: the blue mark was
       * what you saw on a quick load, and it sat there beside the reveal
       * when both were up, because the two drawings are not the same shape
       * in the same box. One mark. The preload above starts fetching it
       * while the document is still being read.
       */
      #boot {
        position: fixed;
        inset: 0;
        /*
         * Over everything, and the number is deliberate.
         *
         * Nothing in the bundle gets to paint over the wait - not the bar
         * at 40, not a dialog at 50, not a toast. Without this the boot
         * screen is simply an element with no z-index of its own and a
         * positioned thing in the page could land on top of it, which is a
         * wait with half a page showing through. Staw: "i really want it to
         * be over everything else".
         */
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #101012;
      }
      /*
       * The same page the site is about to be, not a black rectangle.
       *
       * Staw: "i want it to be the background colour (applying theme
       * appearances & modes) and nothing else". The bundle is not here yet,
       * so these cannot be read from the tokens - they are the six values
       * of `--ink`, and the script below picks one off what this device
       * last had. They have to be kept in step with `design/tokens.css`,
       * which is the price of the boot screen matching the page it turns
       * into instead of flashing black first.
       */
      #boot[data-ink='dark-default'] { background: #101012; }
      #boot[data-ink='light-default'] { background: #f2f3f7; }
      #boot[data-ink='dark-halloween'] { background: #140f0c; }
      #boot[data-ink='light-halloween'] { background: #faf4ee; }
      #boot[data-ink='dark-christmas'] { background: #0d130f; }
      #boot[data-ink='light-christmas'] { background: #f2f8f4; }
      #boot img {
        width: auto;
        height: 150px;
        opacity: 0;
        transition: opacity 200ms ease;
      }
      #boot.drawing img { opacity: 1; }
      /*
       * The way out of a boot screen that is never going to finish.
       *
       * Everything here is in the document, and everything that replaces it
       * is in the bundle - so if the bundle does not arrive, this is the
       * last thing the page ever does. A browser holding an old index asks
       * for pieces that were published over and gets nothing, which is
       * exactly what a refresh does, and the mark sat there for ever
       * saying nothing. After twelve seconds it says so and offers the one
       * thing that fixes it.
       */
      #boot p {
        margin: 1.5rem 0 0;
        display: none;
        max-width: 22rem;
        text-align: center;
        font: 500 14px/1.6 Inter, system-ui, sans-serif;
        color: #8b8b94;
      }
      #boot.slow p { display: block; }
      #boot button {
        margin-top: 0.75rem;
        border: 0;
        border-radius: 999px;
        padding: 0.5rem 1.1rem;
        background: #1b34e8;
        color: #fff;
        font: 700 13px Inter, system-ui, sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <img alt="" src="/brand/logo-reveal.gif"
        onload="window.__kobBootAt = Date.now(); document.getElementById('boot').classList.add('drawing')" />
      <p>
        This is taking longer than it should. Loading the page again usually
        fixes it.
        <br />
        <button type="button" onclick="location.reload()">Load it again</button>
      </p>
    </div>
    <script>
      /*
       * Who gets the wait at all.
       *
       * Staw: "its only on the logged in pages (forum not included)". The
       * reveal is the front door of the thing you use; an At Kobblon page
       * is a page about Kobblon that anybody may read, and holding a reader
       * of the rules behind a four-second film of our logo is a toll gate,
       * not a welcome.
       *
       * Decided here, from the address, before a single frame is drawn -
       * rather than in React, which would mean showing it and then taking
       * it away, which is the flash this is avoiding. `/` is not in the
       * list on purpose: signed in it is Home, and which one it is cannot
       * be known until the session has been read, so it keeps the wait.
       */
      (function () {
        var open = [
          '/about', '/download', '/policies', '/terms', '/privacy',
          '/guidelines', '/support', '/forum', '/login', '/signup',
          '/creator/sign-in', '/launcher/sign-in'
        ]
        var here = location.pathname.replace(/\/+$/, '') || '/'
        for (var i = 0; i < open.length; i += 1) {
          if (here === open[i] || here.indexOf(open[i] + '/') === 0) {
            var boot = document.getElementById('boot')
            if (boot && boot.parentNode) boot.parentNode.removeChild(boot)
            return
          }
        }
      })()
    </script>
    <script>
      /*
       * What colour the wait is.
       *
       * The mode is this device's and the appearance is the account's, but
       * both were on screen last time and both are remembered here, so the
       * boot screen can be the page's own background rather than black on
       * the way to a white one.
       */
      (function () {
        var mode = 'dark'
        var look = 'default'
        try {
          var saved = localStorage.getItem('kobblon.theme')
          if (saved === 'light' || saved === 'dark') mode = saved
          else if (saved === 'system' || saved === null) {
            mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          var worn = localStorage.getItem('kobblon.appearance')
          if (worn === 'halloween' || worn === 'christmas') look = worn
        } catch (e) {}
        /*
         * The script above has already taken the boot screen away on every
         * page that does not get the wait, so on those there is nothing
         * here to colour. Without this check that was a TypeError on the
         * console of every At Kobblon page, the forum, login and signup -
         * harmless only because nothing came after it in this script,
         * which is not a thing to leave resting on.
         */
        var boot = document.getElementById('boot')
        if (boot) boot.setAttribute('data-ink', mode + '-' + look)
      })()

      /*
       * The rescue for a document that cannot load itself.
       *
       * Every page under /u/, /c/ and /worlds/ is a real file written at
       * deploy time, and each one names the pieces of that build by their
       * content hash. The pieces are replaced on the next deploy and the
       * old names stop existing - so a page written by a build that could
       * not reach the database, which is every build run without the
       * service key, goes on pointing at pieces that were deleted weeks
       * ago. The module 404s, nothing in the bundle ever runs, and what is
       * left on screen is this mark, for ever. Staw: "when you reload a
       * page that is not like... made by us directly, like when you reload
       * a profile page or a community page or worlds, then it says this
       * and doesn't load and it keeps doing that".
       *
       * Reloading cannot fix it, because the file on the site is the thing
       * that is wrong - which is why the button under the mark never
       * helped. The index at the root is rewritten by every deploy, so it
       * is always current: this hands the address to it and lets it do the
       * routing. `main.tsx` puts the address back before React looks.
       *
       * Three seconds after the window has loaded, because by then either
       * the bundle has run or it is not going to. Once per tab, so a site
       * that is genuinely down cannot turn this into a loop.
       */
      setTimeout(function () {
        var boot = document.getElementById('boot')
        if (boot) boot.className += ' slow'
      }, 12000)

      window.addEventListener('load', function () {
        setTimeout(function () {
          if (window.__kobUp) return
          if (location.pathname === '/') return
          try {
            if (sessionStorage.getItem('kobblon.rescued')) return
            sessionStorage.setItem('kobblon.rescued', '1')
          } catch (e) { /* a blocked store is no reason not to try once */ }
          location.replace('/?to=' + encodeURIComponent(location.pathname + location.search + location.hash))
        }, 3000)
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
