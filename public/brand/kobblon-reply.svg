<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Kobblon">
  <!--
    The face Kobblon answers a support ticket with: the mark on a burst,
    which is the picture Staw handed over for it. Drawn rather than
    photographed so it stays sharp at 36px in a conversation row and at any
    size in the Workspace, and so it has no second file to keep in step.
  -->
  <defs>
    <clipPath id="tile"><rect width="256" height="256" rx="44" /></clipPath>
    <linearGradient id="kface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#b9c6ff" />
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="#1033c4" />
    <!-- Sixteen rays from the middle, every other one dark: the burst. -->
    <g fill="#0a1f80">
      <path d="M128 128 L160 -40 L224 -40 Z" />
      <path d="M128 128 L256 -8 L300 56 Z" />
      <path d="M128 128 L300 96 L300 160 Z" />
      <path d="M128 128 L300 200 L256 264 Z" />
      <path d="M128 128 L224 296 L160 296 Z" />
      <path d="M128 128 L96 296 L32 296 Z" />
      <path d="M128 128 L0 264 L-44 200 Z" />
      <path d="M128 128 L-44 160 L-44 96 Z" />
      <path d="M128 128 L-44 56 L0 -8 Z" />
      <path d="M128 128 L32 -40 L96 -40 Z" />
    </g>
    <!-- The K, outlined the way the mark is. -->
    <path
      d="M74 46 h40 v52 h14 l34 -34 h44 l-44 44 v8 l48 50 h-46 l-36 -38 h-14 v58 h-40 Z"
      fill="url(#kface)" stroke="#2a52ff" stroke-width="7" stroke-linejoin="round" />
  </g>
</svg>
