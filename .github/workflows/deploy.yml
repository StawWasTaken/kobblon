name: Build site

# GitHub Pages publishes this repository's root from main, so the built site
# is committed there. This keeps that copy in step with src/ on every push.
#
# It also runs every ten minutes, because a link preview for a Space, a
# Community, a person or an upload is a real file written from what is in the
# database, and something made after the last run has no card until the next
# one. An hour of that is an hour of bare links.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The rules the database has taught us, checked before anything else,
      # because a bad migration is the expensive kind of mistake.
      - run: node scripts/check-migrations.mjs

      - run: npm run build

      # A card for everything that is already public. Reads with the same
      # publishable key the browser carries, so it sees what a stranger sees.
      - run: npm run pages:items

      - run: node scripts/publish-to-root.mjs

      # Pushing with GITHUB_TOKEN does not start another workflow run, so
      # this cannot loop.
      - name: Commit the built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A so a Space that went away takes its card with it.
          git add -A
          if git diff --staged --quiet; then
            echo "Build output is already up to date."
            exit 0
          fi
          git commit -m "Rebuild site from ${GITHUB_SHA::7}"
          git push
